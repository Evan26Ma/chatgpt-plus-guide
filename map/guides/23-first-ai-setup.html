      "html": "<ol>\n<li>保存并启用刚配置的供应商或账号。</li>\n<li>回到对话输入框，打开模型选择器。</li>\n<li>选中刚配置的通道和模型。</li>\n<li>发送下面这句话：</li>\n</ol>\n<pre><code class=\"language-text\">请只回复：连接成功。\n</code></pre>\n<p>收到稳定回复后，再做一个小任务：</p>\n<pre><code class=\"language-text\">请告诉我当前工作区的用途，并建议我先做哪一个无风险练习。不要修改任何文件。\n</code></pre>\n<p>能正常回复才说明这条连接基本可用。模型自述的名称不能作为唯一验证依据，要看实际选择和请求结果。</p>\n<p><button class=\"btn btn-sm\" type=\"button\" data-action=\"goto\" data-step=\"choose\">重新选择工具</button></p>",

      "html": "<ol>\n<li><strong>401 / 403</strong>：核对 Key 是否属于这个平台，账号是否有权限、余额或有效套餐。</li>\n<li><strong>模型不存在</strong>：补全准确的模型 ID，并确认已启用、在选择器中选中。</li>\n<li><strong>Coding Plan 异常</strong>：检查是否误用了普通 <code>/api/paas/v4</code> 端点。</li>\n<li><strong>第三方模型无响应</strong>：同时检查协议、Base URL、Key 和模型 ID，不只重填 Key。</li>\n<li><strong>代理修改未生效</strong>：按官方说明重启 ZCode；登录、SSH 等功能并不一定走该代理。</li>\n<li><strong>DeepSeek 最高思考档返回 400</strong>：部分部署不接受 <code>max</code>，可改选 <code>high</code>。</li>\n</ol>\n<p>官方排错入口：<a href=\"https://zcode.z.ai/cn/docs/qa\" target=\"_blank\" rel=\"noopener noreferrer\">ZCode 常见问题</a>。发求助截图时遮住 Key、邮箱和个人文件内容。</p>\n<p><button class=\"btn btn-sm\" type=\"button\" data-action=\"goto\" data-step=\"choose\">重新选择工具</button></p>",

      "html": "<p>你不需要一次掌握所有功能。现在已经完成了一款工具的下载、登录、第一次任务，以及按需的模型连接。</p>\n<div class=\"box block\">\n<h3>以后每次给 AI 布置任务，记住四件事</h3>\n<ol>\n<li><strong>背景</strong>：我要做什么。</li>\n<li><strong>材料</strong>：根据哪些内容处理。</li>\n<li><strong>格式</strong>：希望怎样输出。</li>\n<li><strong>限制</strong>：哪些内容不能猜，哪些操作必须先问我。</li>\n</ol>\n</div>\n<div class=\"list-hint\">\n<p>想理解提示词、上下文和 Token，可继续看站内《AI 入门：第一次和大语言模型对话》；需要管理多个模型来源时，再看《Magpie 安装与模型切换》。以教程导航中实际上线的页面为准。</p>\n</div>\n<p>本教程整理于 2026-10-31。软件界面、模型、费用和资格以各自官方页面为准；教程不收集账号或 API Key。</p>\n<p><button class=\"btn btn-sm\" type=\"button\" data-action=\"goto\" data-step=\"choose\">重新选择工具</button></p>",
