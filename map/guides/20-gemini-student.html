      "html": "<p>准备好 Google 账号后，从检查 IP、确认账号，到完成 SheerID 验证、领取 <strong>Google AI Pro 12 个月免费版</strong>，按七步走完。谷歌账号注册已拆成 <a href=\"https://map.plus-guide.fun/guides/28-google-account.html\" target=\"_blank\" rel=\"noopener noreferrer\">独立教程</a>，本篇从已有账号开始。</p>\n<div class=\"note tip\">\n<p><strong>已经有学生会员？</strong> 直接从第 6 步查看领取和升级选项。</p>\n</div>\n<div class=\"box block\">\n<h3>开始前准备</h3>\n<ul>\n<li><strong>可登录的 Google 个人账号</strong>。没有账号的先完成 <a href=\"https://map.plus-guide.fun/guides/28-google-account.html\" target=\"_blank\" rel=\"noopener noreferrer\">谷歌账号注册</a>；已有账号的，第 2 步检查当前账号及地区。</li>\n<li><strong>美区住宅 IP</strong>：先测位置、IP 属性和纯净度。</li>\n<li><strong>付款方式</strong>：最好提前添加，后面领免费版和升级都会用到。</li>\n</ul>\n</div>\n<p><button class=\"btn\" type=\"button\" data-action=\"goto\" data-step=\"claim\">已有学生会员，从第 6 步开始</button></p>",

      "html": "<p>第 3 步的资格检查和后面的免费 Pro，都跟着 <strong>账号关联地区</strong> 走。注册账号并不保证关联到美国，已有账号也要先核对当前地区；按账号实际情况处理后再往下走。改区从提交到生效要花几天，放在这一步办最稳。</p>\n<p>改区申请要用 <strong>美国住宅 IP</strong> 提交，和第 1 步同一个出口。先回到 <a href=\"https://ippure.com/\" target=\"_blank\" rel=\"noopener noreferrer\">IPPure</a> 确认还是美国、住宅、原生、纯净。</p>\n<figure class=\"shot\"><button  type=\"button\" aria-label=\"放大查看：IPPure 显示美国住宅原生 IP，极度纯净\" data-cap=\"图 2 · 提交改区前的 IP 检查：美国、住宅、原生、极度纯净。\" data-img=\"../assets/guides/gemini-student/12-region-ippure.webp?v=ace4fc2eac\"><img src=\"../assets/guides/gemini-student/12-region-ippure.webp?v=ace4fc2eac\" alt=\"IPPure 显示美国住宅原生 IP，极度纯净\" loading=\"lazy\" decoding=\"async\"><span class=\"zoom\" aria-hidden=\"true\">点击放大</span></button><figcaption>图 2 · 提交改区前的 IP 检查：美国、住宅、原生、极度纯净。</figcaption></figure>\n<p>打开 <a href=\"https://policies.google.com/country-association-form\" target=\"_blank\" rel=\"noopener noreferrer\">Google 账号关联地区更改表单</a>，登录要改区的账号。表单开头会写明当前关联的地区，示例账号是中国。</p>\n<figure class=\"shot\"><button  type=\"button\" aria-label=\"放大查看：改区表单开头写明当前关联地区为中国\" data-cap=\"图 3 · 表单开头会回显当前关联地区，示例账号是中国。\" data-img=\"../assets/guides/gemini-student/13-region-form.webp?v=50691f24f7\"><img src=\"../assets/guides/gemini-student/13-region-form.webp?v=50691f24f7\" alt=\"改区表单开头写明当前关联地区为中国\" loading=\"lazy\" decoding=\"async\"><span class=\"zoom\" aria-hidden=\"true\">点击放大</span></button><figcaption>图 3 · 表单开头会回显当前关联地区，示例账号是中国。</figcaption></figure>\n<p>按下面两处填，然后提交：</p>\n<ol>\n<li><strong>您的账号应改为与哪个地区关联？</strong> 国家选 <strong>美国</strong>；选了美区会多出一栏州，填 <strong>免税州</strong>，示例用的俄勒冈州。</li>\n<li><strong>为什么您的账号应与这个地区关联？</strong> 随便勾几项就行。示例勾的是“我的工作地/学习地和居住地分属不同的地区”“我经常旅行”“我经常使用虚拟专用网 (VPN)”这三项。</li>\n</ol>\n<figure class=\"shot\"><button  type=\"button\" aria-label=\"放大查看：国家选美国、州选俄勒冈州的改区表单\" data-cap=\"图 4 · 国家选美国；美区要再选一个州，示例用免税州俄勒冈。\" data-img=\"../assets/guides/gemini-student/14-region-country.webp?v=c0d1ff8afe\"><img src=\"../assets/guides/gemini-student/14-region-country.webp?v=c0d1ff8afe\" alt=\"国家选美国、州选俄勒冈州的改区表单\" loading=\"lazy\" decoding=\"async\"><span class=\"zoom\" aria-hidden=\"true\">点击放大</span></button><figcaption>图 4 · 国家选美国；美区要再选一个州，示例用免税州俄勒冈。</figcaption></figure>\n<figure class=\"shot\"><button  type=\"button\" aria-label=\"放大查看：关联原因复选框勾了三项后准备提交\" data-cap=\"图 5 · 原因项按示例随便勾几项，就可以提交了。\" data-img=\"../assets/guides/gemini-student/15-region-reason.webp?v=dec497c295\"><img src=\"../assets/guides/gemini-student/15-region-reason.webp?v=dec497c295\" alt=\"关联原因复选框勾了三项后准备提交\" loading=\"lazy\" decoding=\"async\"><span class=\"zoom\" aria-hidden=\"true\">点击放大</span></button><figcaption>图 5 · 原因项按示例随便勾几项，就可以提交了。</figcaption></figure>\n<p>提交后页面会回显 <strong>“您的请求已提交”</strong> 和你填的目标地区。</p>\n<figure class=\"shot\"><button  type=\"button\" aria-label=\"放大查看：提交成功页面显示请求已提交，目标地区为美国俄勒冈州\" data-cap=\"图 6 · 提交后回显“您的请求已提交”和目标地区。\" data-img=\"../assets/guides/gemini-student/16-region-submit.webp?v=aa4289abd6\"><img src=\"../assets/guides/gemini-student/16-region-submit.webp?v=aa4289abd6\" alt=\"提交成功页面显示请求已提交，目标地区为美国俄勒冈州\" loading=\"lazy\" decoding=\"async\"><span class=\"zoom\" aria-hidden=\"true\">点击放大</span></button><figcaption>图 6 · 提交后回显“您的请求已提交”和目标地区。</figcaption></figure>\n<div class=\"note\">\n<p><strong>改区不是立即生效。</strong> 提交后一般过几天会收到 Google 的改区确认邮件，账号地区才会变过来，所以放在第 2 步就提交。等生效的这几天，正好把第 3 步要用的付款方式准备好。示例截图里登录账号的邮箱已打码。</p>\n</div>\n<div class=\"list-hint\">\n<p><strong>改区流程也出了单篇版。</strong> 不领学生优惠、只想改区的，直接看 <a href=\"https://map.plus-guide.fun/guides/21-google-region.html\" target=\"_blank\" rel=\"noopener noreferrer\">《谷歌账号改区》教程</a>。</p>\n</div>",
