<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="$description">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6459d9">
<link rel="icon" type="image/svg+xml" href="$favicon">
<title>$title · Plus Guide</title>
$font_preload
$css_tag
</head>
<!--
  G 风格教程页外壳。由 ai-guides/_src/build.py --g 生成，不要直接改生成后的页面：
  样式改 ai-guides/assets/g-guide.css，交互改 ai-guides/assets/g-engine.js，
  这个外壳改 ai-guides/assets/g-page.html，内容改 ai-guides/guides/<slug>.js。
-->
<body>
<div id="guideShell">
<a class="skip" href="#stepTitle">跳到当前步骤</a>
<header class="top">
  <div class="top-in">
    <a class="mark" id="homeLink" href="$home" aria-label="Plus Guide 首页">plus<i>.</i>guide</a>
    <span class="crumb"><span class="cat"><a id="catLink" href="$home"></a> / </span><b id="guideTitle">$title</b></span>
    <div class="top-actions">
      <a class="btn btn-sm" id="allLink" href="${home}#tutorials" aria-label="全部教程"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg><span>全部教程</span></a>
    </div>
  </div>
</header>

<details class="mobile-toc" id="mobileToc">
  <summary><span id="mProgText">第 1 步</span><span class="track" aria-hidden="true"><span class="fill" id="mFill" style="display:block"></span></span><span>步骤</span></summary>
  <nav class="toc" id="mToc" aria-label="本篇步骤"></nav>
</details>

<div class="layout">
  <aside class="side" aria-label="本篇步骤">
    <div class="side-inner">
      <div class="prog">
        <div class="prog-row"><span>进度</span><b id="progText">第 1 步</b></div>
        <div class="track" role="progressbar" id="progBar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="教程进度"><div class="fill" id="fill"></div></div>
      </div>
      <nav class="toc first" id="toc" aria-label="步骤目录"></nav>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="main-in">
$price_note
      <article class="step" id="step" aria-live="polite"><h1 id="stepTitle" tabindex="-1">$title</h1><p class="intro">正在加载内容……如果这行字一直在，说明页面脚本没跑起来，刷新一次试试。</p></article>
    </div>
  </main>

  <aside class="rail" aria-label="帮助">
    <div class="rail-inner">
      <section class="box box-coach" id="coachBox">
        <span class="tag" aria-hidden="true"><span class="sticker">小提示</span></span>
        <h2>这一步的小提示</h2>
        <p id="coach"></p>
      </section>
      <section class="box box-help">
        <span class="tag" aria-hidden="true"><span class="sticker">别硬扛</span></span>
        <h2>卡住了？</h2>
        <p>进群说明教程名、做到第几步和报错，截图先遮住邮箱、密码和验证码。</p>
        <a class="btn btn-ink btn-sm" href="https://t.me/+_lOsXtUCD9MxNzY1" target="_blank" rel="noopener noreferrer">打开 Telegram 群</a>
        <details><summary>扫码进群</summary><img src="$qr" alt="AI 交流群二维码" width="200" height="200" loading="lazy"></details>
      </section>
      <section class="box">
        <h2>本机记录</h2>
        <p class="save" id="saveStatus"><i aria-hidden="true"></i>进度自动保存在这个浏览器</p>
        <div class="reset-row" id="resetRow"><button class="btn btn-sm" type="button" id="resetBtn">重新开始</button></div>
      </section>
    </div>
  </aside>
</div>
</div>

<main class="access" id="accessPanel" hidden></main>
<dialog class="gate-dialog" id="gateDialog" aria-labelledby="gateTitle" aria-describedby="gateLead"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="img-dialog" id="imgDialog" aria-labelledby="imgCaption">
  <div class="img-bar"><span id="imgCaption"></span><button class="btn btn-sm" type="button" id="imgClose">关闭</button></div>
  <div class="img-scroll"><img id="imgFull" alt=""></div>
</dialog>

<script>
window.AI_GUIDE_SLUG = '$slug';
window.AI_GUIDE = $data;
</script>
$engine_tag
</body>
</html>
